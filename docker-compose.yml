services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nuproof
      POSTGRES_USER: nuproof
      POSTGRES_PASSWORD: nuproof
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuproof -d nuproof"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nuproof_postgres:/var/lib/postgresql/data

volumes:
  nuproof_postgres:
